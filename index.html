<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo digital SIGA">
  <title>SIGA | Catálogo digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/version.js"></script>
  <script>
    (function () {
      var stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = 'css/ecommerce.css?v=' + encodeURIComponent(PAYLOAD_VERSION);
      document.head.appendChild(stylesheet);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#catalogo" aria-label="SIGA inicio"><span class="brand-mark">S</span><span>SIGA</span></a>
      <a class="header-contact" href="https://wa.me/5215634861468" target="_blank" rel="noopener"> <span>¿Tienes dudas?</span> WhatsApp</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <p class="eyebrow">Catálogo digital</p>
          <h1>Encuentra lo que necesitas.</h1>
          <p class="hero-copy">Explora nuestros productos y contáctanos directamente por WhatsApp para realizar tu pedido.</p>
        </div>
        <div class="hero-shape" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </section>

    <section id="catalogo" class="container catalog-section">
      <div class="catalog-toolbar">
        <div>
          <p class="eyebrow">Nuestros productos</p>
          <h2>Catálogo</h2>
        </div>
        <div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Buscar productos..." autocomplete="off"></div>
      </div>
      <div id="categories" class="category-list" aria-label="Categorías"></div>
      <div id="catalog-status" class="status-message">Cargando catálogo...</div>
      <div id="products" class="product-grid"></div>
      <div id="catalog-sentinel" aria-hidden="true"></div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <div id="product-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
      <div id="product-detail" class="detail-layout"></div>
    </article>
  </div>

  <footer class="site-footer"><div class="container">SIGA · Catálogo digital <span id="site-version"></span></div></footer>
  <script>
    (function () {
      var version = typeof PAYLOAD_VERSION !== 'undefined' ? PAYLOAD_VERSION : '1.0.0';
      var versionElement = document.getElementById('site-version');
      if (versionElement) versionElement.textContent = 'v' + version;
      var module = document.createElement('script');
      module.type = 'module';
      module.src = 'js/catalogo.js?v=' + encodeURIComponent(version);
      document.body.appendChild(module);
    })();
  </script>
</body>
</html>
